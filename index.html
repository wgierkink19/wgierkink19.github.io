<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #02060a;
    --line: #7fdcff;
    --bright: #e6faff;
    --mid: #4fa6c4;
    --dim: #1f4a5c;
    --faint: #0f2733;
    --amber: #ffb347;
    --red: #ff5a4a;
    --glow: 0 0 6px rgba(127,220,255,.5);
    --c: rgba(255,179,71,.85);
    --amber-dim: rgba(255,179,71,.72);
    --aglow: 0 0 6px rgba(255,179,71,.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--line); }
  body {
    background:
      linear-gradient(rgba(127,220,255,.035) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgba(127,220,255,.035) 1px, transparent 1px) 0 0 / 40px 40px,
      var(--bg);
    font-family: "Share Tech Mono", "SF Mono", Menlo, Monaco, monospace;
    font-size: 14px; letter-spacing: .05em;
    text-shadow: var(--glow);
    display: flex; flex-direction: column; overflow: hidden;
    padding: 10px; gap: 10px;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100;
    background:
      repeating-linear-gradient(to bottom, transparent 0, transparent 2px, rgba(0,0,0,.16) 3px),
      radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,.5) 100%);
  }
  a { color: inherit; text-decoration: none; }

  /* Frames with corner ticks */
  .frame {
    position: relative; border: 1px solid var(--faint);
    background:
      linear-gradient(var(--c),var(--c)) top left / 14px 1px no-repeat,
      linear-gradient(var(--c),var(--c)) top left / 1px 14px no-repeat,
      linear-gradient(var(--c),var(--c)) top right / 14px 1px no-repeat,
      linear-gradient(var(--c),var(--c)) top right / 1px 14px no-repeat,
      linear-gradient(var(--c),var(--c)) bottom left / 14px 1px no-repeat,
      linear-gradient(var(--c),var(--c)) bottom left / 1px 14px no-repeat,
      linear-gradient(var(--c),var(--c)) bottom right / 14px 1px no-repeat,
      linear-gradient(var(--c),var(--c)) bottom right / 1px 14px no-repeat,
      rgba(2,10,16,.75);
  }

  /* Header */
  header { display: grid; grid-template-columns: 1fr minmax(380px, 640px) 1fr; align-items: center; gap: 18px; padding: 12px 16px; }
  .title { font-size: 17px; letter-spacing: .3em; white-space: nowrap; color: var(--amber); text-shadow: var(--aglow); }
  .hright { display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
  form.search {
    display: flex; align-items: center; gap: 12px; padding: 9px 14px;
    border: 1px solid var(--amber-dim); background: rgba(255,179,71,.04);
    box-shadow: 0 0 12px rgba(127,220,255,.12), inset 0 0 14px rgba(127,220,255,.05);
  }
  form.search:focus-within { border-color: var(--amber); box-shadow: 0 0 18px rgba(255,179,71,.35), inset 0 0 14px rgba(255,179,71,.08); }
  form.search label { color: var(--amber); text-shadow: 0 0 6px rgba(255,179,71,.5); white-space: nowrap; font-size: 13px; letter-spacing: .2em; }
  form.search input {
    flex: 1; min-width: 0; background: transparent; border: none; outline: none;
    color: var(--bright); caret-color: var(--line); font: inherit; font-size: 17px; text-shadow: var(--glow);
  }
  form.search input::placeholder { color: var(--mid); opacity: .7; }
  form.search .go { font-size: 11px; color: var(--mid); letter-spacing: .15em; white-space: nowrap; }
  .links { display: flex; gap: 8px; }
  .links a, button {
    border: 1px solid var(--dim); padding: 5px 10px; font-size: 12px; letter-spacing: .15em;
    background: transparent; color: var(--line); font-family: inherit; cursor: pointer; text-shadow: var(--glow);
    white-space: nowrap;
  }
  .links a:hover, button:hover, button.on { background: var(--amber); color: var(--bg); text-shadow: none; border-color: var(--amber); }
  .sys { font-size: 12px; color: var(--mid); white-space: nowrap; }
  .sys b { font-weight: normal; color: var(--line); }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Primary row */
  .primary { display: grid; grid-template-columns: 1fr auto 1fr; grid-template-areas: 'globe clock wx'; gap: 10px; }
  .left { grid-area: globe; } .clock { grid-area: clock; } .wx { grid-area: wx; }
  .left { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; padding: 10px 18px; container-type: inline-size; }
  .left .dtg { white-space: nowrap; }
  .astro { display: none; border-left: 1px solid var(--faint); padding-left: 26px; }
  .astro .dtg { font-size: 16px; margin-bottom: 8px; }
  .ybar { height: 4px; background: var(--faint); margin: -4px 0 10px; position: relative; width: 150px; }
  .ybar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--amber); box-shadow: var(--aglow); }
  @container (min-width: 740px) { .astro { display: block; } }
  @container (min-width: 400px) and (max-width: 739px) {
    .astro { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; width: 100%; border-left: none; border-top: 1px solid var(--faint); padding: 10px 0 0; }
  }
  canvas#globe { width: 190px; height: 190px; flex: none; }
  .label { font-size: 11px; color: var(--amber-dim); letter-spacing: .25em; text-shadow: var(--aglow); }
  .dtg { font-size: 20px; letter-spacing: .12em; margin: 2px 0 10px; }
  .amber { color: var(--amber); text-shadow: 0 0 6px rgba(255,179,71,.5); }
  .clock { display: flex; align-items: center; gap: 26px; padding: 12px 34px 12px 22px; }
  .clock-main { display: flex; flex-direction: column; align-items: center; }
  .locs { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; justify-content: center; }
  .locs button { font-size: 10px; padding: 3px 8px; letter-spacing: .12em; }
  canvas#sky { width: 300px; max-width: 100%; height: 41px; margin-top: 6px; }

  /* Companion */
  .pet { width: 200px; display: flex; flex-direction: column; align-items: center; user-select: none; }
  canvas#pet { width: 100%; height: 150px; cursor: pointer; border-bottom: 1px solid var(--faint); }
  .pet .name { font-size: 10px; letter-spacing: .3em; color: var(--mid); margin-top: 4px; cursor: text; }
  .pet .say { font-size: 11px; line-height: 1.35; color: var(--amber); text-shadow: 0 0 6px rgba(255,179,71,.45); text-align: center; min-height: 30px; margin-top: 3px; max-width: 184px; }
  .big { font-size: 76px; line-height: 1; letter-spacing: .05em; color: var(--bright); text-shadow: 0 0 16px rgba(127,220,255,.75); }
  .big .sec { font-size: 32px; color: var(--amber); text-shadow: 0 0 10px rgba(255,179,71,.6); }
  .hdate { margin-top: 8px; font-size: 15px; letter-spacing: .2em; }
  .ruler { margin-top: 10px; width: 100%; height: 8px;
    background: repeating-linear-gradient(90deg, rgba(255,179,71,.35) 0 1px, transparent 1px 12px); position: relative; }
  .ruler i { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--amber); box-shadow: 0 0 6px var(--amber); }

  /* Weather */
  .wx { padding: 12px 18px; display: flex; flex-direction: column; gap: 8px; }
  .wx-top { display: flex; align-items: baseline; gap: 14px; }
  .wx-temp { font-size: 42px; line-height: 1; color: var(--bright); }
  .wx-f { font-size: 15px; color: var(--mid); }
  .wx-cond { font-size: 14px; letter-spacing: .15em; }
  .wx-row { font-size: 12px; color: var(--mid); letter-spacing: .12em; }
  .wx-row b { font-weight: normal; color: var(--line); }
  .rain { display: flex; align-items: flex-end; gap: 4px; height: 26px; border-bottom: 1px solid var(--dim); }
  .rain span { flex: 1; background: var(--amber); box-shadow: var(--aglow); min-height: 1px; opacity: .9; }
  .wx-grid { display: grid; grid-template-columns: 170px 1fr; gap: 16px; align-items: start; }
  canvas#wxmap { width: 170px; height: 196px; border: 1px solid var(--faint); }
  #wxinfo { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .days { display: grid; gap: 3px; font-size: 12px; border-top: 1px solid var(--faint); padding-top: 6px; }
  .days div { display: grid; grid-template-columns: 52px 62px 1fr; white-space: nowrap; }
  .days .dn { color: var(--amber-dim); letter-spacing: .2em; }
  .days .dc { color: var(--mid); overflow: hidden; text-overflow: ellipsis; }
  .wx { container-type: inline-size; }
  .hours { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; font-size: 11px; text-align: center; }
  .hr { display: flex; flex-direction: column; gap: 1px; border-left: 1px solid var(--faint); padding: 2px 0; }
  .hr .hh { color: var(--amber-dim); }
  .hr .ht { color: var(--bright); font-size: 12px; }
  .hr .hp { color: var(--mid); font-size: 10px; }
  .hr:nth-child(n+7) { display: none; }
  @container (min-width: 620px) { .hours { grid-template-columns: repeat(9, 1fr); } .hr:nth-child(n+7) { display: flex; } .hr:nth-child(n+10) { display: none; } }
  @container (min-width: 860px) { .hours { grid-template-columns: repeat(12, 1fr); } .hr:nth-child(n+10) { display: flex; } }

  /* Main */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 330px 1fr 460px; gap: 10px; }
  section { display: flex; flex-direction: column; min-height: 0; }
  .ph { display: flex; justify-content: space-between; padding: 9px 16px; border-bottom: 1px solid var(--faint); font-size: 12px; letter-spacing: .28em; color: var(--bright); }
  .ph > span:first-child { color: var(--amber); text-shadow: var(--aglow); }
  .ph .tag { color: var(--mid); letter-spacing: .1em; }
  .body { flex: 1; overflow-y: auto; padding: 4px 16px 14px; }
  .body::-webkit-scrollbar { width: 5px; }
  .body::-webkit-scrollbar-thumb { background: var(--dim); }

  .city { display: grid; grid-template-columns: 1fr auto; row-gap: 2px; padding: 8px 0; border-bottom: 1px dashed var(--faint); }
  .city .n { letter-spacing: .15em; color: var(--amber-dim); text-shadow: var(--aglow); }
  .city .t { font-size: 19px; text-align: right; color: var(--bright); }
  .city .m, .city .d { font-size: 11px; color: var(--mid); }
  .city .d { text-align: right; }
  .city .d.night { color: var(--dim); }

  textarea {
    flex: 1; width: 100%; resize: none; border: none; outline: none; background: transparent;
    color: var(--bright); caret-color: var(--line); font: inherit; font-size: 16px; line-height: 1.7;
    text-shadow: var(--glow); padding: 14px 18px;
  }
  textarea::placeholder { color: var(--dim); }
  ::selection { background: var(--dim); color: #fff; }
  .logbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; border-top: 1px solid var(--faint); font-size: 12px; color: var(--mid); }
  .logbar button { margin-left: 6px; }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--faint); }
  .filters button { font-size: 10px; padding: 3px 7px; letter-spacing: .1em; }
  .item { display: block; padding: 10px 0; border-bottom: 1px dashed var(--faint); }
  .item:hover .h { color: #fff; }
  .item .meta { font-size: 11px; color: var(--mid); margin-bottom: 3px; letter-spacing: .12em; }
  .item .src { color: var(--amber); text-shadow: 0 0 6px rgba(255,179,71,.4); }
  .item .h { line-height: 1.45; color: var(--bright); }
  .msg { padding: 14px 0; color: var(--mid); }

  #cities { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); column-gap: 30px; align-content: start; }
  @media (max-width: 1250px) {
    body { overflow: auto; }
    header { grid-template-columns: auto minmax(0, 1fr) auto; }
    form.search { min-width: 0; }
    form.search .go { display: none; }
    .primary { grid-template-columns: 1fr; grid-template-areas: 'clock' 'globe' 'wx'; }
    .left { justify-content: space-evenly; }
    .clock { justify-content: space-between; gap: 30px; padding: 12px 30px; }
    .pet { flex: 1; width: auto; min-width: 200px; }
    canvas#pet { height: 150px; }
    main { grid-template-columns: 1fr 1fr; }
    main section:last-child { grid-column: 1 / -1; }
    section { min-height: 440px; }
  }
  @media (max-width: 1120px) { .sys { display: none; } }
  @media (min-width: 1000px) and (max-width: 1250px) {
    .primary { grid-template-columns: 1fr 1fr; grid-template-areas: 'clock clock' 'globe wx'; }
  }
  @media (max-width: 760px) {
    .clock { flex-direction: column; }
    .pet { width: 100%; }
    header { grid-template-columns: 1fr; }
    .hright { justify-content: flex-start; flex-wrap: wrap; }
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header class="frame">
    <div class="title">WG // TERMINAL</div>
    <form class="search" action="https://duckduckgo.com/" method="get" autocomplete="off">
      <label for="q">&gt; SEARCH</label>
      <input id="q" name="q" placeholder="DuckDuckGo" autofocus>
      <span class="go">↵ ENTER</span>
    </form>
    <div class="hright">
      <nav class="links">
        <a href="https://understandingwar.org">ISW</a>
        <a href="https://www.nytimes.com/international/">NYT INTL</a>
        <a href="https://www.nhl.com">NHL</a>
        <a href="https://www.irregularwarfare.org">IWI</a>
      </nav>
      <div class="sys">LINK <b id="link">—</b> <span class="blink">█</span></div>
    </div>
  </header>

  <div class="primary">
    <div class="left frame">
      <canvas id="globe" width="190" height="190"></canvas>
      <div>
        <div class="label">ZULU // UTC</div>
        <div class="dtg" id="zdtg">—</div>
        <div class="label">LOCAL DTG // <span id="hzone">—</span></div>
        <div class="dtg amber" id="hdtg">—</div>
        <div class="label">SUN</div>
        <div class="dtg" id="sun" style="font-size:15px">—</div>
      </div>
      <div class="astro">
        <div><div class="label">CALENDAR</div><div class="dtg" id="wk">—</div></div>
        <div><div class="label">DAY OF YEAR</div><div class="dtg" id="doy">—</div><div class="ybar"><i id="ybar"></i></div></div>
        <div><div class="label">MOON</div><div class="dtg" id="moon">—</div></div>
        <div><div class="label">DAYLIGHT</div><div class="dtg" id="dlen">—</div></div>
      </div>
    </div>

    <div class="clock frame">
      <div class="pet">
        <canvas id="pet" width="184" height="132" title="Click to say hi"></canvas>
        <div class="name" id="petname" title="Double-click to rename">ZIB</div>
        <div class="say" id="say"></div>
      </div>
      <div class="clock-main">
        <div class="locs" id="locs"></div>
        <div class="label" id="locname">THE HAGUE // NLD</div>
        <div class="big" id="htime">--:--<span class="sec">:--</span></div>
        <div class="hdate" id="hdate">—</div>
        <canvas id="sky" width="340" height="46"></canvas>
        <div class="ruler"><i id="dayMark"></i></div>
      </div>
    </div>

    <div class="wx frame" id="wx">
      <div class="label">METEO // <span id="wxloc">THE HAGUE</span> <span id="wxtime" style="float:right"></span></div>
      <div class="wx-grid">
        <canvas id="wxmap" width="170" height="196"></canvas>
        <div id="wxinfo"><div class="msg">&gt; ACQUIRING…</div></div>
      </div>
    </div>
  </div>

  <main>
    <section class="frame">
      <div class="ph"><span>WORLD CLOCKS</span><span class="tag">24H</span></div>
      <div class="body" id="cities"></div>
    </section>

    <section class="frame">
      <div class="ph"><span>FIELD LOG</span><span class="tag" id="logdtg">—</span></div>
      <textarea id="note" placeholder="&gt; ENTER LOG…" spellcheck="true"></textarea>
      <div class="logbar">
        <span id="status">STATUS: SAVED</span>
        <span><button id="stamp">+ DTG</button><button id="export">EXPORT .TXT</button></span>
      </div>
    </section>

    <section class="frame">
      <div class="ph"><span>INTEL FEED</span><span class="tag" id="feedtime">—</span></div>
      <div class="filters" id="filters"></div>
      <div class="body" id="feed"><div class="msg">&gt; ESTABLISHING LINK…</div></div>
    </section>
  </main>

<script>
  document.title = 'Personal Terminal';
  const $ = id => document.getElementById(id);
  const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const pad = n => String(n).padStart(2, '0');
  const LOCS = {
    hague: { btn: 'DEN HAAG', name: 'THE HAGUE', cc: 'NLD', tz: 'Europe/Amsterdam', lat: 52.08, lon: 4.30, map: 'NL', center: [5.25, 52.15], k: 58,
             refs: [['AMS', 4.90, 52.37], ['RTM', 4.48, 51.92], ['UTR', 5.12, 52.09], ['GRQ', 6.57, 53.22], ['EIN', 5.47, 51.44]], sea: ['NORTH SEA', 3.45, 52.75] },
    nyc: { btn: 'NEW YORK', name: 'NEW YORK', cc: 'USA', tz: 'America/New_York', lat: 40.71, lon: -74.01, map: 'NY', center: [-73.95, 40.72], k: 115,
           refs: [['JFK', -73.78, 40.64], ['EWR', -74.17, 40.69], ['BRX', -73.87, 40.84], ['LGA', -73.87, 40.77]], sea: ['ATLANTIC', -73.55, 40.25] },
    wellington: { btn: 'WELLINGTON FL', name: 'WELLINGTON', cc: 'USA // FL', tz: 'America/New_York', lat: 26.66, lon: -80.24, map: 'FL', center: [-80.2, 26.65], k: 145,
                  refs: [['WPB', -80.05, 26.71], ['JUP', -80.09, 26.93], ['BOC', -80.08, 26.37], ['DEL', -80.07, 26.46]], sea: ['ATLANTIC', -79.93, 26.95] }
  };
  let LOCKEY = 'hague';
  try { const s = localStorage.getItem('wes-loc'); if (s && LOCS[s]) LOCKEY = s; } catch (e) {}
  let LOC = LOCS[LOCKEY];
  let HAGUE = LOC.tz;   // the "local" time zone everything follows

  /* ---------- Time ---------- */
  function parts(tz, d) {
    const p = {};
    new Intl.DateTimeFormat('en-GB', {
      timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric',
      hour: 'numeric', minute: 'numeric', second: 'numeric', weekday: 'short'
    }).formatToParts(d).forEach(x => p[x.type] = x.value);
    return { y: +p.year, mo: +p.month, d: +p.day, h: +p.hour % 24, mi: +p.minute, s: +p.second, wd: p.weekday.toUpperCase().slice(0, 3) };
  }
  function offsetMin(tz, d) {
    const p = parts(tz, d);
    return Math.round((Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s) - Math.floor(d / 1000) * 1000) / 60000);
  }
  function zoneLetter(min) {
    if (min % 60) return null;
    const h = min / 60;
    if (h === 0) return 'Z';
    if (h >= 1 && h <= 9) return 'ABCDEFGHI'[h - 1];
    if (h >= 10 && h <= 12) return 'KLM'[h - 10];
    if (h <= -1 && h >= -12) return 'NOPQRSTUVWXY'[-h - 1];
    return null;
  }
  const utcLabel = m => 'UTC' + (m < 0 ? '-' : '+') + Math.floor(Math.abs(m) / 60) + (Math.abs(m) % 60 ? ':' + pad(Math.abs(m) % 60) : '');
  function dtg(tz, d) {
    const p = parts(tz, d), L = zoneLetter(offsetMin(tz, d)) || '*';
    return pad(p.d) + pad(p.h) + pad(p.mi) + L + ' ' + MON[p.mo - 1] + ' ' + String(p.y).slice(2);
  }

  const CITIES = [
    ['THE HAGUE',     'Europe/Amsterdam', 52.08, 4.30],
    ['WASHINGTON DC', 'America/New_York', 38.9, -77.04],
    ['LOS ANGELES',   'America/Los_Angeles', 34.05, -118.24],
    ['LONDON',        'Europe/London', 51.51, -0.13],
    ['BRUSSELS',      'Europe/Brussels', 50.85, 4.35],
    ['KYIV',          'Europe/Kyiv', 50.45, 30.52],
    ['MOSCOW',        'Europe/Moscow', 55.76, 37.62],
    ['TEL AVIV',      'Asia/Jerusalem', 32.08, 34.78],
    ['DUBAI',         'Asia/Dubai', 25.2, 55.27],
    ['KABUL',         'Asia/Kabul', 34.53, 69.17],
    ['NEW DELHI',     'Asia/Kolkata', 28.61, 77.21],
    ['BEIJING',       'Asia/Shanghai', 39.9, 116.4],
    ['TOKYO',         'Asia/Tokyo', 35.68, 139.69],
    ['SYDNEY',        'Australia/Sydney', -33.87, 151.21],
  ];
  $('cities').innerHTML = CITIES.map((c, i) => `
    <div class="city"><div class="n">${c[0]}</div><div class="t" id="ct${i}">--:--</div>
    <div class="m" id="cm${i}"></div><div class="d" id="cd${i}"></div></div>`).join('');

  const NATO = { A: 'ALPHA', B: 'BRAVO', C: 'CHARLIE', D: 'DELTA', E: 'ECHO', N: 'NOVEMBER', O: 'OSCAR', P: 'PAPA', Q: 'QUEBEC', R: 'ROMEO', S: 'SIERRA', T: 'TANGO', U: 'UNIFORM', Z: 'ZULU' };
  function tick() {
    const now = new Date();
    const h = parts(HAGUE, now), hOff = offsetMin(HAGUE, now), L = zoneLetter(hOff);
    $('htime').innerHTML = pad(h.h) + ':' + pad(h.mi) + '<span class="sec">:' + pad(h.s) + '</span>';
    $('hdate').textContent = h.wd + ' ' + pad(h.d) + ' ' + MON[h.mo - 1] + ' ' + h.y;
    $('hdtg').textContent = dtg(HAGUE, now);
    $('hzone').textContent = (NATO[L] || L || '*') + ' ' + utcLabel(hOff);
    $('zdtg').textContent = dtg('UTC', now);

    ctx.strokeStyle = 'rgba(127,220,255,.25)'; ctx.lineWidth = .8;
    ctx.beginPath(); ctx.arc(CX, CY, R + 7, 0, Math.PI * 2); ctx.stroke();
    for (let a = 0; a < 360; a += 10) {
      const r1 = R + 7, r2 = a % 30 === 0 ? R + 13 : R + 10, A = a * RAD;
      ctx.strokeStyle = a % 30 === 0 ? 'rgba(255,179,71,.85)' : 'rgba(127,220,255,.25)';
      ctx.beginPath(); ctx.moveTo(CX + r1 * Math.cos(A), CY + r1 * Math.sin(A)); ctx.lineTo(CX + r2 * Math.cos(A), CY + r2 * Math.sin(A)); ctx.stroke();
    }

    // graticule
    ctx.strokeStyle = 'rgba(127,220,255,.18)'; ctx.lineWidth = .7;
    ctx.beginPath();
    for (let lon = -180; lon < 180; lon += 30) { const pts = []; for (let lat = -90; lat <= 90; lat += 5) pts.push([lat, lon]); path(pts, lon0); }
    for (let lat = -60; lat <= 60; lat += 30) { const pts = []; for (let lon = -180; lon <= 180; lon += 5) pts.push([lat, lon]); path(pts, lon0); }
    ctx.stroke();

    // land
    ctx.strokeStyle = 'rgba(127,220,255,.85)'; ctx.lineWidth = .9;
    ctx.beginPath();
    for (const ring of LAND) { const pts = []; for (let i = 0; i < ring.length; i += 2) pts.push([ring[i + 1], ring[i]]); path(pts, lon0); }
    ctx.stroke();

    // day/night terminator
    const [sLat, sLon] = subsolar(new Date());
    ctx.strokeStyle = 'rgba(255,179,71,.85)'; ctx.shadowColor = 'rgba(255,179,71,.7)'; ctx.setLineDash([3, 3]);
    ctx.beginPath(); path(terminator(sLat, sLon), lon0); ctx.stroke(); ctx.setLineDash([]);

    // cities
    ctx.shadowColor = 'rgba(127,220,255,.7)';
    for (const c of CITIES) {
      const [x, y, z] = proj(c[2], c[3], lon0);
      if (z > 0) { ctx.fillStyle = 'rgba(230,250,255,.9)'; ctx.fillRect(x - 1.5, y - 1.5, 3, 3); }
    }
    // The Hague reticle
    const [hx, hy, hz] = proj(HQ[0], HQ[1], lon0);
    if (hz > 0) {
      ctx.strokeStyle = '#ffb347'; ctx.shadowColor = 'rgba(255,179,71,.8)'; ctx.lineWidth = 1;
      const pulse = 6 + 2 * Math.sin(t / 300);
      ctx.beginPath(); ctx.arc(hx, hy, pulse, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(hx - 12, hy); ctx.lineTo(hx - 4, hy); ctx.moveTo(hx + 4, hy); ctx.lineTo(hx + 12, hy);
      ctx.moveTo(hx, hy - 12); ctx.lineTo(hx, hy - 4); ctx.moveTo(hx, hy + 4); ctx.lineTo(hx, hy + 12);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  /* ---- Globe panel modes: EARTH → TRACKING → EARTH → HOMEWORLD ---- */
  const MODES = [['earth', 45000], ['track', 12000], ['earth', 45000], ['home', 14000]];
  let modeIdx = 0, modeStart = 0, glitchUntil = 0, announced = -1;
  cv.style.cursor = 'pointer'; cv.title = 'Click to switch view';
  cv.addEventListener('click', () => nextMode(performance.now()));
  function nextMode(t) { modeIdx = (modeIdx + 1) % MODES.length; modeStart = t; glitchUntil = t + 450; }

  const ease = k => 1 - Math.pow(1 - Math.min(1, Math.max(0, k)), 3);
  function label(txt, y, color) {
    ctx.shadowBlur = 0; ctx.fillStyle = color || 'rgba(127,220,255,.9)';
    ctx.font = '9px "Share Tech Mono", Menlo, monospace'; ctx.textAlign = 'center';
    ctx.fillText(txt, CX, y); ctx.textAlign = 'left'; ctx.shadowBlur = 4;
  }

  function saucer(x, y, s, rot, t) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
    ctx.strokeStyle = '#ffb347'; ctx.shadowColor = 'rgba(255,179,71,.85)'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(0, -2, 7, Math.PI, 0); ctx.stroke();                 // dome
    ctx.fillStyle = '#ffb347'; ctx.fillRect(-3, -5, 1.6, 2); ctx.fillRect(1.4, -5, 1.6, 2); // pilot's eyes
    ctx.beginPath(); ctx.ellipse(0, 0, 17, 4.5, 0, 0, Math.PI * 2); ctx.stroke(); // hull
    ctx.beginPath(); ctx.moveTo(-17, 0); ctx.lineTo(17, 0); ctx.stroke();
    for (let i = -1; i <= 1; i++) if ((Math.floor(t / 250) + i) % 2) { ctx.beginPath(); ctx.arc(i * 8, 4, 1.4, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }

  function drawTrack(t, k) {
    ctx.strokeStyle = 'rgba(127,220,255,.9)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(CX, CY, R + 6, 0, Math.PI * 2); ctx.stroke();
    // rotating tick ring
    const spin = t / 9000;
    for (let a = 0; a < 360; a += 6) {
      const A = a * RAD + spin, long = a % 30 === 0;
      ctx.strokeStyle = long ? 'rgba(127,220,255,.85)' : 'rgba(127,220,255,.35)';
      ctx.beginPath(); ctx.moveTo(CX + (R - 2) * Math.cos(A), CY + (R - 2) * Math.sin(A));
      ctx.lineTo(CX + (R - (long ? 12 : 6)) * Math.cos(A), CY + (R - (long ? 12 : 6)) * Math.sin(A)); ctx.stroke();
    }
    // radar sweep
    const sw = t / 700;
    const grad = ctx.createConicGradient ? ctx.createConicGradient(sw, CX, CY) : null;
    if (grad) {
      grad.addColorStop(0, 'rgba(127,220,255,.22)'); grad.addColorStop(.08, 'rgba(127,220,255,0)'); grad.addColorStop(1, 'rgba(127,220,255,0)');
      ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(CX, CY, R - 14, 0, Math.PI * 2); ctx.fill();
    }
    // saucer flies in and settles in the crosshair
    const e = .5 - .5 * Math.cos(Math.PI * Math.min(1, k / .62));
    const ox = (1 - e) * (-95 + Math.sin(t / 400) * 10), oy = (1 - e) * (-55 + Math.cos(t / 300) * 12);
    const locked = k > .62, friendly = k > .78;
    const sx = CX + ox, sy = CY + oy + (friendly ? Math.sin(t / 160) * 1.5 : 0);
    const rot = friendly ? Math.sin(t / 140) * .18 : (1 - e) * .25;
    saucer(sx, sy, .9 + e * .5, rot, t);
    // crosshair arms close in as it gets near
    const gap = 16 + 34 * (1 - e);
    ctx.strokeStyle = locked ? '#ffb347' : 'rgba(127,220,255,.95)'; ctx.shadowColor = locked ? 'rgba(255,179,71,.8)' : 'rgba(127,220,255,.7)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      ctx.moveTo(CX + dx * (R - 16), CY + dy * (R - 16)); ctx.lineTo(CX + dx * (gap + 8), CY + dy * (gap + 8));
      // little double tick on each arm
      ctx.moveTo(CX + dx * (gap + 14) - dy * 4, CY + dy * (gap + 14) - dx * 4); ctx.lineTo(CX + dx * (gap + 14) + dy * 4, CY + dy * (gap + 14) + dx * 4);
    }
    ctx.stroke();
    // corner brackets around the target once locked
    if (locked) {
      const b = 24 - Math.min(1, (k - .62) / .1) * 4;
      ctx.beginPath();
      for (const [ax, ay] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
        ctx.moveTo(sx + ax * b, sy + ay * (b - 8)); ctx.lineTo(sx + ax * b, sy + ay * b); ctx.lineTo(sx + ax * (b - 8), sy + ay * b);
      }
      ctx.stroke();
    }
    // readouts
    const rng = Math.round(940 * (1 - e));
    label('RNG ' + String(rng).padStart(4, '0') + ' KM', CY + R - 22);
    if (friendly) label('UNIDENTIFIED  ✦  FRIENDLY', CY - R + 30, '#e6faff');
    else if (locked) { if (Math.floor(t / 180) % 2) label('◆ LOCK ◆', CY - R + 30, '#ffb347'); }
    else label('TRACKING…', CY - R + 30);
  }

  function drawHome(t, k) {
    const PR = 44, TI = 22 * RAD, rot = t / 9000;
    const pp = (lat, lon) => {
      const p = lat * RAD, l = lon * RAD + rot;
      const z = Math.sin(TI) * Math.sin(p) + Math.cos(TI) * Math.cos(p) * Math.cos(l);
      return [CX + PR * Math.cos(p) * Math.sin(l), CY - PR * (Math.cos(TI) * Math.sin(p) - Math.sin(TI) * Math.cos(p) * Math.cos(l)), z];
    };
    const ringTilt = -.28;
    const ring = (from, to, alpha, rx, ry) => {
      ctx.strokeStyle = 'rgba(127,220,255,' + alpha + ')';
      ctx.beginPath(); ctx.ellipse(CX, CY, rx, ry, ringTilt, from, to); ctx.stroke();
    };
    const moonA = t / 2600, mx = CX + Math.cos(moonA) * 78 * Math.cos(ringTilt) - Math.sin(moonA) * 24 * Math.sin(ringTilt),
          my = CY + Math.cos(moonA) * 78 * Math.sin(ringTilt) + Math.sin(moonA) * 24 * Math.cos(ringTilt);
    const moon = () => { ctx.strokeStyle = 'rgba(230,250,255,.9)'; ctx.beginPath(); ctx.arc(mx, my, 4.5, 0, Math.PI * 2); ctx.stroke(); };
    // back half of the rings, and the moon when it's behind
    ctx.lineWidth = 1;
    ring(Math.PI, Math.PI * 2, .35, 82, 19); ring(Math.PI, Math.PI * 2, .2, 70, 15);
    if (Math.sin(moonA) < 0) moon();
    // planet body
    ctx.fillStyle = '#02060a'; ctx.strokeStyle = 'rgba(127,220,255,.95)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(CX, CY, PR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // graticule bands
    ctx.strokeStyle = 'rgba(127,220,255,.25)'; ctx.lineWidth = .7; ctx.beginPath();
    const line = pts => { let pen = false; for (const [a, b] of pts) { const [x, y, z] = pp(a, b); if (z > 0) { pen ? ctx.lineTo(x, y) : ctx.moveTo(x, y); pen = true; } else pen = false; } };
    for (let lon = 0; lon < 360; lon += 30) { const pts = []; for (let lat = -90; lat <= 90; lat += 6) pts.push([lat, lon]); line(pts); }
    for (let lat = -60; lat <= 60; lat += 20) { const pts = []; for (let lon = 0; lon <= 360; lon += 6) pts.push([lat, lon]); line(pts); }
    ctx.stroke();
    // craters
    ctx.strokeStyle = 'rgba(127,220,255,.8)'; ctx.lineWidth = .9;
    for (const [lat, lon, r] of [[20, 40, 6], [-25, 110, 8], [40, 200, 5], [-10, 260, 7], [5, 330, 4], [-45, 20, 4]]) {
      const [x, y, z] = pp(lat, lon);
      if (z > .15) { ctx.beginPath(); ctx.ellipse(x, y, r * z, r * .7, 0, 0, Math.PI * 2); ctx.stroke(); }
    }
    // ZIB's pod on the north pole
    const [hx, hy, hz] = pp(70, 0);
    if (hz > 0) {
      ctx.strokeStyle = '#ffb347'; ctx.shadowColor = 'rgba(255,179,71,.8)';
      ctx.beginPath(); ctx.arc(hx, hy, 4, Math.PI, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hx, hy - 4); ctx.lineTo(hx, hy - 8); ctx.stroke();
      ctx.shadowColor = 'rgba(127,220,255,.7)';
    }
    // front half of the rings, moon in front
    ctx.lineWidth = 1;
    ring(0, Math.PI, .9, 82, 19); ring(0, Math.PI, .45, 70, 15);
    if (Math.sin(moonA) >= 0) moon();
    // twinkling stars in the corners
    ctx.fillStyle = '#e6faff';
    for (let i = 0; i < 18; i++) {
      const x = (i * 53) % SIZE, y = (i * 97) % SIZE;
      if (Math.hypot(x - CX, y - CY) < R + 4) continue;
      ctx.globalAlpha = .3 + .7 * Math.abs(Math.sin(t / 700 + i)); ctx.fillRect(x, y, 1.3, 1.3);
    }
    ctx.globalAlpha = 1;
    label('PLANET ZORP // 4.2 LY', CY + R + 2);
    label('DEEP SPACE SCAN', CY - R + 2);
  }

  let last = 0;
  function draw(t) {
    requestAnimationFrame(draw);
    if (t - last < 40) return; last = t;
    if (!modeStart) modeStart = t;
    if (t - modeStart > MODES[modeIdx][1]) nextMode(t);
    const mode = MODES[modeIdx][0], k = (t - modeStart) / MODES[modeIdx][1];
    ctx.clearRect(0, 0, SIZE, SIZE);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(127,220,255,.7)'; ctx.shadowBlur = 4;
    if (mode === 'earth') drawEarth(t);
    else if (mode === 'track') drawTrack(t, k);
    else drawHome(t, k);
    ctx.shadowBlur = 0;

    // ZIB comments on its ship and planet
    if (announced !== modeIdx + ':' + modeStart && typeof speak === 'function' && typeof pet !== 'undefined' && !pet.inside) {
      if (mode === 'track' && k > .8) { speak('A UFO?! NOT A STORK.'); announced = modeIdx + ':' + modeStart; }
      if (mode === 'home' && k > .15) { speak('NO DITCHES UP THERE.'); announced = modeIdx + ':' + modeStart; }
    }

    // glitch transition between views
    if (t < glitchUntil) {
      for (let i = 0; i < 9; i++) {
        const y = Math.random() * SIZE, h = 1 + Math.random() * 5;
        ctx.fillStyle = 'rgba(127,220,255,' + (.08 + Math.random() * .25) + ')';
        ctx.fillRect(Math.random() * 40 - 20, y, SIZE, h);
      }
      ctx.drawImage(cv, 0, 0, cv.width, cv.height, (Math.random() - .5) * 8, 0, SIZE, SIZE);
    }
  }
  requestAnimationFrame(draw);

  /* ---------- Weather (Open-Meteo, no key) ---------- */
  const wxUrl = () => 'https://api.open-meteo.com/v1/forecast?latitude=' + LOC.lat + '&longitude=' + LOC.lon
    + '&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,wind_direction_10m,weather_code,is_day'
    + '&minutely_15=precipitation&forecast_minutely_15=8'
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset'
    + '&hourly=temperature_2m,precipitation_probability,weather_code&forecast_hours=12'
    + '&timezone=' + encodeURIComponent(LOC.tz) + '&forecast_days=3&wind_speed_unit=kmh';
  const wxKey = () => 'wes-wx-cache-' + LOCKEY;
  function cond(c) {
    if (c === 0) return 'CLEAR'; if (c === 1) return 'MAINLY CLEAR'; if (c === 2) return 'PARTLY CLOUDY'; if (c === 3) return 'OVERCAST';
    if (c === 45 || c === 48) return 'FOG'; if (c >= 51 && c <= 57) return 'DRIZZLE';
    if (c === 61) return 'LIGHT RAIN'; if (c === 63) return 'RAIN'; if (c === 65) return 'HEAVY RAIN'; if (c === 66 || c === 67) return 'FREEZING RAIN';
    if (c >= 71 && c <= 77) return 'SNOW'; if (c >= 80 && c <= 82) return 'SHOWERS'; if (c === 85 || c === 86) return 'SNOW SHOWERS';
    if (c >= 95) return 'THUNDERSTORM'; return '—';
  }
  function metar(c) {
    if (c === 0) return 'SKC'; if (c === 1) return 'FEW'; if (c === 2) return 'SCT'; if (c === 3) return 'OVC';
    if (c === 45 || c === 48) return 'FG'; if (c >= 51 && c <= 57) return 'DZ'; if (c >= 61 && c <= 67) return 'RA';
    if (c >= 71 && c <= 77) return 'SN'; if (c >= 80 && c <= 82) return 'SHRA'; if (c === 85 || c === 86) return 'SHSN'; return c >= 95 ? 'TS' : '—';
  }
  const compass = d => ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(d / 22.5) % 16];
  const F = c => Math.round(c * 9 / 5 + 32);

  let lastWx = null;
  function renderWx(w, at) {
    lastWx = w;
    const c = w.current, m = w.minutely_15, d = w.daily;
    const rain = m.precipitation.slice(0, 8), times = m.time.slice(0, 8);
    const first = rain.findIndex(v => v > 0.05);
    const max = Math.max(1, ...rain);
    const rainTxt = first < 0 ? 'DRY NEXT 2H' : first === 0 ? 'RAIN NOW' : 'RAIN FROM ' + times[first].slice(11, 16);
    const dayName = s => ['SUN','MON','TUE','WED','THU','FRI','SAT'][new Date(s + 'T12:00').getDay()];
    $('sun').textContent = '↑ ' + d.sunrise[0].slice(11, 16) + '   ↓ ' + d.sunset[0].slice(11, 16);
    $('wxtime').textContent = at;
    $('wxinfo').innerHTML = `
      <div class="wx-top">
        <div class="wx-temp">${Math.round(c.temperature_2m)}°C</div>
        <div><div class="wx-f">${F(c.temperature_2m)}°F</div><div class="wx-cond">${cond(c.weather_code)}</div></div>
      </div>
      <div class="wx-row">FEELS <b>${Math.round(c.apparent_temperature)}°</b> · HUM <b>${c.relative_humidity_2m}%</b></div>
      <div class="wx-row">WIND <b>${Math.round(c.wind_speed_10m)} KM/H ${compass(c.wind_direction_10m)}</b></div>
      <div class="wx-row">PRECIP // <b class="${first < 0 ? '' : 'amber'}">${rainTxt}</b></div>
      <div class="rain">${rain.map(v => `<span style="height:${Math.max(4, v / max * 100)}%;${v > 0.05 ? '' : 'opacity:.2'}"></span>`).join('')}</div>
      ${w.hourly ? `<div class="hours">${w.hourly.time.slice(0, 12).map((tm, i) => `<div class="hr"><span class="hh">${tm.slice(11, 13)}H</span><span class="ht">${Math.round(w.hourly.temperature_2m[i])}°</span><span class="hp">${metar(w.hourly.weather_code[i])}</span><span class="hp">${w.hourly.precipitation_probability[i] ?? 0}%</span></div>`).join('')}</div>` : ''}
      <div class="days">${d.time.map((t, i) => `<div><span class="dn">${i === 0 ? 'TODAY' : dayName(t)}</span>
        <span>${Math.round(d.temperature_2m_max[i])}°/${Math.round(d.temperature_2m_min[i])}°</span>
        <span class="dc">${cond(d.weather_code[i])} ${d.precipitation_probability_max[i] ?? 0}%</span></div>`).join('')}</div>`;
    setScene(c);
    if (typeof astro === 'function') astro();
  }
  async function refreshWx() {
    try {
      const r = await fetch(wxUrl()); const w = await r.json();
      if (!w.current) throw 0;
      try { localStorage.setItem(wxKey(), JSON.stringify({ at: Date.now(), w })); } catch (e) {}
      { const n = parts(HAGUE, new Date()); renderWx(w, 'UPD ' + pad(n.h) + ':' + pad(n.mi)); }
    } catch (e) {
      try {
        const c = JSON.parse(localStorage.getItem(wxKey()) || 'null');
        if (c) renderWx(c.w, 'CACHED');
        else $('wxinfo').innerHTML = '<div class="msg">&gt; NO SIGNAL. RETRYING…</div>';
      } catch (e2) {}
    }

  async function viaRss2Json(f) {

  async function refreshFeed() {

  /* ---------- Companion: a Hague stork (with its eel) ---------- */
  const pc = $('pet'), px = pc.getContext('2d'), say = $('say'), nameEl = $('petname');
  let PW = 184; const PH = 150, GY = 128;

  const POND = [6, 52];               // ditch with eels
  let MILL = 104;                     // little windmill
  pc.width = PW * DPR; pc.height = PH * DPR; px.scale(DPR, DPR);

  let petName = 'ZIB';
  try { petName = localStorage.getItem('wes-pet-name') || 'ZIB'; } catch (e) {}
  nameEl.textContent = petName;
  nameEl.addEventListener('dblclick', () => {
    const n = prompt('Name your stork:', petName);
    if (n && n.trim()) { petName = n.trim().toUpperCase().slice(0, 12); nameEl.textContent = petName; try { localStorage.setItem('wes-pet-name', petName); } catch (e) {} speak('I AM ' + petName + '! KLEP! ♥'); }
  });

  let typing;
  function speak(text) {
    clearInterval(typing); say.textContent = ''; let i = 0;
    typing = setInterval(() => { say.textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(typing); }, 35);
  }

  const pet = {
    x: 96, y: GY, face: 1, loc: 'ground', state: 'idle', until: 0,
    target: null, then: null, path: null, phase: 0, flap: 0,
    jump: 0, vy: 0, wave: 0, heart: 0, inside: false, wokeUntil: 0
  };
  const mouse = { x: -1e4, y: -1e4, inPanel: false, wasIn: false, lastHi: 0 };
  const STARS2 = Array.from({ length: 16 }, () => [Math.random() * PW, Math.random() * 50 + 4, Math.random() * 6]);
  const drops = Array.from({ length: 28 }, () => ({ x: Math.random() * PW, y: Math.random() * GY, v: 2 + Math.random() * 1.5 }));
  const ripples = [];

  const hagueHour = () => parts(HAGUE, new Date()).h;
  const isNight = () => { const h = hagueHour(); return h >= 23 || h < 7; };
  function wxFlags() {
    if (!lastWx) return {};
    const c = lastWx.current, code = c.weather_code;
    return {
      rain: (code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95,
      snow: (code >= 71 && code <= 77) || code === 85 || code === 86,
      cold: c.temperature_2m < 4,
      windy: c.wind_speed_10m > 35,

    };
  }

  // ---- behaviour ----
  function setState(s, ms) { pet.state = s; pet.until = performance.now() + ms; }
  function goTo(x, then) { pet.target = x; pet.then = then; pet.state = 'walk'; pet.face = x > pet.x ? 1 : -1; }
  function flyTo(x, y, loop, then) {
    const pts = [];
    if (loop) { for (let i = 0; i < 2 + Math.floor(Math.random() * 2); i++) pts.push([20 + Math.random() * (PW - 40), 14 + Math.random() * 30]); }
    else pts.push([(pet.x + x) / 2, Math.min(pet.y, y) - 22 - Math.random() * 14]);
    pts.push([x, y]);
    pet.path = pts; pet.then = then; pet.state = 'fly';
  }
  const toNest = (then) => flyTo(NX, NY, Math.random() < .5, () => { pet.loc = 'nest'; then ? then() : setState('nest', 4000); });
  const toGround = (then) => flyTo(70 + Math.random() * Math.max(30, NX - 110), GY, Math.random() < .5, () => { pet.loc = 'ground'; then ? then() : setState('idle', 2500); });

  function clatter(ms, msg) { setState('clatter', ms || 2200); if (msg !== false) speak(msg || 'KLEPPER-KLEPPER!'); }

  function choose() {
    const now = performance.now(), f = wxFlags();
    if (isNight() && now > pet.wokeUntil) {
      if (pet.loc === 'nest') { pet.inside = true; setState('sleep', 60000); return; }
      toNest(() => { pet.inside = true; speak('WELTRUSTEN, WG… ✦'); setState('sleep', 60000); });
      return;
    }
    if (pet.inside) { pet.inside = false; clatter(2600, hagueHour() < 12 ? 'GOEDEMORGEN, WG! KLEP!' : 'BACK ON DUTY. KLEP!'); return; }
    const r = Math.random();
    if (pet.loc === 'nest') {
      if (r < .35) toGround();
      else if (r < .5) toNest();                     // a loop around the sky and back
      else if (r < .68) clatter();
      else if (r < .84) setState('preen', 3000);
      else setState('oneleg', 4000 + Math.random() * 3000);
      return;
    }
    if (f.rain && r < .3) { toNest(() => { setState('nest', 6000); speak('RAIN. GOOD FOR EELS.'); }); return; }
    if (r < .22) goTo(64 + Math.random() * Math.max(30, NX - 100), () => setState('idle', 1500 + Math.random() * 2000));
    else if (r < .40) setState('oneleg', 4000 + Math.random() * 4000);
    else if (r < .55) goTo(POND[1] + 10, () => { pet.face = -1; setState('fish', 4200); });
    else if (r < .67) clatter();
    else if (r < .78) setState('preen', 3000);
    else if (r < .93 && !f.windy) toNest();
    else if (!f.windy) toGround();
    else setState('idle', 3000);
  }

  pc.addEventListener('click', () => {
    if (pet.inside) {
      pet.inside = false; pet.wokeUntil = performance.now() + 25000;

    }
    if (pet.state === 'fly') { pet.heart = 1; speak('WHEEE! ♥'); return; }
    if (Math.random() < .5) clatter(1800, ['KLEPPER-KLEPPER!', 'HI WG! KLEP!', 'VREDE EN RECHT!'][Math.floor(Math.random() * 3)]);
    else { if (pet.jump === 0) pet.vy = 3.4; pet.wave = 1; pet.heart = 1; speak(['♥', 'HELLO, HUMAN.', 'WANT SOME EEL?'][Math.floor(Math.random() * 3)]); }
  });

  document.addEventListener('mousemove', e => {

  // ---- drawing ----
  const LINE = 'rgba(127,220,255,.9)', BRIGHT = '#e6faff', AMBER = '#ffb347', BG = '#030b11', DARK = '#0a1820';

  // cows: a Dutch meadow needs cows
  const COWS = [{ f: .42, dir: 1, ph: 0 }, { f: .62, dir: -1, ph: 2 }];
  function drawCow(c, t) {
    const x = Math.round(PW * c.f) + Math.sin(t / 9000 + c.ph) * 8, y = GY - 1, d = c.dir;
    const graze = Math.sin(t / 1300 + c.ph) > -.2;

    px.strokeStyle = 'rgba(230,250,255,.75)'; px.lineWidth = 1; px.fillStyle = BG;

    px.fillStyle = 'rgba(127,220,255,.55)'; px.fillRect(-5, -10, 4, 3); px.fillRect(2, -9, 3, 3);
    px.beginPath(); px.moveTo(-6, -4); px.lineTo(-6, 0); px.moveTo(-3, -4); px.lineTo(-3, 0); px.moveTo(3, -4); px.lineTo(3, 0); px.moveTo(6, -4); px.lineTo(6, 0); px.stroke();
    px.beginPath(); px.moveTo(-8, -10); px.quadraticCurveTo(-11, -9, -10, -5); px.stroke();

  function sizePet() {

    NX = PW - 26; MILL = Math.round(PW * .56);
    STARS2.length = 0; for (let i = 0; i < Math.round(PW / 10); i++) STARS2.push([Math.random() * PW, Math.random() * 60 + 4, Math.random() * 6]);
    if (wasNest && pet.state !== 'fly') pet.x = NX;

  }
  if (window.ResizeObserver) new ResizeObserver(sizePet).observe(pc);

  function drawHabitat(t, f) {
    const night = isNight() || f.dark;
    if (night) {
      px.fillStyle = BRIGHT;
      for (const [x, y, ph] of STARS2) { px.globalAlpha = .2 + .7 * Math.abs(Math.sin(t / 900 + ph)); px.fillRect(x, y, 1.2, 1.2); }
      px.globalAlpha = 1;
    }
    // windmills in the distance (more of them when there's room)
    const spin = t / (f.windy ? 400 : 1400);
    const mills = [[MILL, 1]];
    if (PW > 320) mills.push([Math.round(PW * .3), .75]);
    if (PW > 520) mills.push([Math.round(PW * .78), .6]);
    for (const [mx, s] of mills) {
      px.strokeStyle = 'rgba(127,220,255,' + (.2 + s * .15) + ')'; px.lineWidth = .9;
      px.beginPath(); px.moveTo(mx - 5 * s, GY); px.lineTo(mx - 3 * s, GY - 20 * s); px.lineTo(mx + 3 * s, GY - 20 * s); px.lineTo(mx + 5 * s, GY); px.stroke();
      px.beginPath(); px.moveTo(mx - 4 * s, GY - 20 * s); px.lineTo(mx, GY - 24 * s); px.lineTo(mx + 4 * s, GY - 20 * s); px.stroke();
      px.beginPath();
      for (let i = 0; i < 4; i++) { const a = spin * (1 + s * .2) + i * Math.PI / 2; px.moveTo(mx, GY - 21 * s); px.lineTo(mx + Math.cos(a) * 12 * s, GY - 21 * s + Math.sin(a) * 12 * s); }

    // a far-off dike line

    // ground + ditch

    px.beginPath(); px.moveTo(0, GY + .5); px.lineTo(POND[0], GY + .5);
    px.lineTo(POND[0] + 5, GY + 7); px.lineTo(POND[1] - 5, GY + 7); px.lineTo(POND[1], GY + .5); px.lineTo(PW, GY + .5); px.stroke();
    px.strokeStyle = 'rgba(127,220,255,.45)'; px.setLineDash([4, 3]); px.lineDashOffset = -t / 120;
    px.beginPath(); px.moveTo(POND[0] + 3, GY + 2.5); px.lineTo(POND[1] - 3, GY + 2.5); px.stroke();
    px.setLineDash([]); px.lineDashOffset = 0;
    px.strokeStyle = 'rgba(127,220,255,.3)';
    for (let x = POND[1] + 6; x < PW; x += 14) { px.beginPath(); px.moveTo(x, GY + 4); px.lineTo(x + 5, GY + 4); px.stroke(); }
    // ripples where the stork fishes
    for (let i = ripples.length - 1; i >= 0; i--) {
      const q = ripples[i]; q.r += .35; q.a -= .03;
      if (q.a <= 0) { ripples.splice(i, 1); continue; }
      px.strokeStyle = 'rgba(127,220,255,' + q.a + ')'; px.beginPath(); px.ellipse(q.x, GY + 2.5, q.r, q.r * .3, 0, 0, Math.PI * 2); px.stroke();
    }
    // reeds with amber cattails
    const sway = Math.sin(t / 800) * (f.windy ? 3 : 1.3);
    px.lineWidth = 1;
    for (const [x, h] of [[3, 20], [7, 15], [POND[1] + 2, 18], [POND[1] + 6, 24], [POND[1] + 9, 14]]) {
      px.strokeStyle = LINE; px.beginPath(); px.moveTo(x, GY); px.quadraticCurveTo(x, GY - h * .6, x + sway, GY - h); px.stroke();
      px.fillStyle = AMBER; px.beginPath(); px.ellipse(x + sway, GY - h - 2.5, 1.3, 3, 0, 0, Math.PI * 2); px.fill();
    }

    // nest pole + nest
    px.strokeStyle = LINE; px.lineWidth = 1.4;
    px.beginPath(); px.moveTo(NX, GY); px.lineTo(NX, NY + 6); px.stroke();
    px.lineWidth = 1; px.beginPath(); px.moveTo(NX - 12, NY + 6); px.lineTo(NX + 12, NY + 6); px.stroke();
    px.beginPath(); px.moveTo(NX, NY + 18); px.lineTo(NX - 10, NY + 6); px.moveTo(NX, NY + 18); px.lineTo(NX + 10, NY + 6); px.stroke();
    px.strokeStyle = 'rgba(255,179,71,.8)'; px.lineWidth = 1;
    px.beginPath();
    for (let i = 0; i < 9; i++) {
      const x1 = NX - 16 + i * 4, y1 = NY + 5 - (i % 2) * 3;
      px.moveTo(x1, y1); px.lineTo(x1 + 6 - (i % 3) * 3, NY + 1 + (i % 3) * 2);
    }
    px.moveTo(NX - 17, NY + 1); px.quadraticCurveTo(NX, NY + 9, NX + 17, NY + 1);
    px.stroke();

    // Zzz from the nest
    if (pet.inside) {
      px.fillStyle = BRIGHT; px.font = '9px "Share Tech Mono", Menlo, monospace';
      for (let i = 0; i < 3; i++) {
        const k = ((t / 2400) + i / 3) % 1;
        px.globalAlpha = 1 - k; px.fillText('z', NX + 8 + k * 10, NY - 30 - k * 26); px.globalAlpha = 1;
      }
    }

    // weather in the habitat
    if (f.rain || f.snow) {
      for (const d of drops) {
        d.y += f.snow ? .5 : d.v; if (f.snow) d.x += Math.sin(t / 600 + d.v) * .3;
        if (d.y > GY) { d.y = -4; d.x = Math.random() * PW; }
      }
      if (f.snow) { px.fillStyle = BRIGHT; for (const d of drops) { px.beginPath(); px.arc(d.x, d.y, 1.1, 0, Math.PI * 2); px.fill(); } }
      else { px.strokeStyle = 'rgba(127,220,255,.45)'; px.lineWidth = .8; px.beginPath(); for (const d of drops) { px.moveTo(d.x, d.y); px.lineTo(d.x - 1, d.y - 5); } px.stroke(); }
    }
  }

  // the eel, wriggling from the bill tip
  function eel(x, y, t, dir) {
    px.strokeStyle = LINE; px.lineWidth = 1.8;
    px.beginPath(); px.moveTo(x, y);
    let ex = x, ey = y;
    for (let i = 1; i <= 9; i++) {
      ex = x + Math.sin(t / 140 + i * .9) * 2.2 * (i / 9) + dir * i * .5;
      ey = y + i * 1.5;
      px.lineTo(ex, ey);
    }
    px.stroke();
    px.fillStyle = LINE; px.beginPath(); px.arc(x + dir * .5, y - .6, 1.4, 0, Math.PI * 2); px.fill();
  }

  function bill(hx, hy, ang, open, t, withEel) {
    const L = 14;
    const tx = hx + Math.cos(ang) * L, ty = hy + Math.sin(ang) * L;
    const nx = -Math.sin(ang), ny = Math.cos(ang);
    px.fillStyle = AMBER; px.strokeStyle = AMBER; px.lineWidth = 1;

    sctx.clearRect(0, 0, SW, SH);
    sctx.lineCap = 'round'; sctx.lineJoin = 'round';
    sctx.shadowColor = 'rgba(127,220,255,.6)'; sctx.shadowBlur = 3;
    if (LOCKEY === 'nyc') skyNY(t); else if (LOCKEY === 'wellington') skyFL(t); else skyHague(t);
    sctx.shadowBlur = 0;
  }
  requestAnimationFrame(skyLoop);

  /* ---------- Location switcher ---------- */
  function renderLocs() {
    const el = $('locs'); el.innerHTML = '';
    Object.entries(LOCS).forEach(([k, l]) => {
      const b = document.createElement('button'); b.textContent = l.btn;
      if (k === LOCKEY) b.className = 'on';
      b.onclick = () => setLocation(k);
      el.appendChild(b);
    });
  }
  function setLocation(k, quiet) {
    LOCKEY = k; LOC = LOCS[k]; HAGUE = LOC.tz; HQ[0] = LOC.lat; HQ[1] = LOC.lon;
    try { localStorage.setItem('wes-loc', k); } catch (e) {}
    $('locname').textContent = LOC.name + ' // ' + LOC.cc;
    $('wxloc').textContent = LOC.name;
    renderLocs(); drawBase(); tick(); astro();
    if (!quiet) {
      lastWx = null; $('wxinfo').innerHTML = '<div class="msg">&gt; ACQUIRING…</div>'; $('wxtime').textContent = '';
      refreshWx();
      if (typeof speak === 'function' && !pet.inside) speak(k === 'hague' ? 'HOME SWEET HAGUE. KLEP!' : k === 'nyc' ? 'NEW YORK! SO MANY PIGEONS.' : 'FLORIDA! WOOD STORKS LIVE THERE.');
    }
  }
  setLocation(LOCKEY, true);
</script>
</body>
</html>
